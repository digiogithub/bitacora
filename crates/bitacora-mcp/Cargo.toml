[package]
name = "bitacora-mcp"
description = "Bitacora: MCP server over Streamable HTTP (loopback only, bearer token, audited undoable writes; ADR-010)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bitacora-core.workspace = true
bitacora-config.workspace = true
bitacora-markdown.workspace = true
bitacora-index.workspace = true
bitacora-sync.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
getrandom.workspace = true
directories.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
tracing.workspace = true
blake3.workspace = true
jiff.workspace = true
keyring = { workspace = true, optional = true }

[features]
default = ["keyring-store"]
# OS keychain for MCP token secrets (macOS Keychain, Windows Credential Manager, Secret Service).
keyring-store = ["dep:keyring"]

[dev-dependencies]
bitacora-testkit.workspace = true
tokio = { workspace = true, features = ["io-util"] }
