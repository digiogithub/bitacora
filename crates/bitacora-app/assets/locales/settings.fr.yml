    consent_title: Envoyer les notes de ce graphe à Pando ?
    consent_body: "Les blocs indexés de ce graphe sont envoyés à %{target} et stockés dans la base de connaissances partagée de Pando, la mémoire des agents. Tout agent ou client Pando qui interroge cette base de connaissances peut les lire, pas seulement Bitacora. Les pages marquées private:: true et vos exclusions ne sont jamais envoyées. Les agents ne peuvent pas modifier vos notes sauf si vous l'activez séparément. Vous pouvez révoquer ce consentement à tout moment et supprimer ce qui a été envoyé."
    purge_title: Révoquer le consentement et supprimer vos données ?
    purge_body: Révoque votre consentement, supprime tous les documents de ce graphe de la base de connaissances de Pando, arrête la synchronisation, le chat et l'accès des agents à ce graphe, et efface les décisions d'outils mémorisées par Bitacora. Les fichiers de votre graphe et l'index local ne sont jamais touchés. Acceptez à nouveau pour le réactiver.
  mode:
    reindex: Reconstruit l'index
    restart: Redémarrage requis
  confirm:
    ok: Appliquer
    cancel: Annuler
    reindex_title: Reconstruire l'index ?
    reindex_body: Ce paramètre change la façon dont les fichiers sont lus ou nommés ; l'index est donc reconstruit à partir des fichiers du graphe. Vos fichiers ne sont pas modifiés, hormis logseq/config.edn.
    substring_on_title: Activer la recherche par sous-chaîne ?
    substring_on_body: L'index trigramme est construit à partir de chaque bloc. Cela peut prendre du temps sur un grand graphe et agrandit l'index.
    substring_off_title: Désactiver la recherche par sous-chaîne ?
    substring_off_body: L'index trigramme est supprimé, ce qui divise environ par deux la taille de l'index. Les recherches de fragments à l'intérieur des mots deviennent plus lentes et moins complètes.
    revoke_title: "Révoquer le jeton %{name} ?"
    revoke_body: Les clients qui l'utilisent seront refusés à leur prochaine requête. Cette action est irréversible.
    rotate_title: "Remplacer le secret de %{name} ?"
    rotate_body: L'ancien secret cesse immédiatement de fonctionner. Vous verrez le nouveau une seule fois.
    reset_keys_title: Restaurer les raccourcis par défaut ?
    reset_keys_body: Chaque raccourci que vous avez modifié revient à sa valeur par défaut.
    conflict_title: "%{keys} est déjà utilisé"
    conflict_body: "Dans le même contexte, il déclenche : %{actions}. L'associer ici le retire de là-bas."
