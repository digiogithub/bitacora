    substring_on_body: El índice de trigramas se construye con cada bloque. Puede tardar en un grafo grande y hace el índice más grande.
    substring_off_title: "¿Desactivar la búsqueda por subcadenas?"
    substring_off_body: El índice de trigramas se elimina, lo que reduce el índice a la mitad aproximadamente. Las búsquedas de fragmentos dentro de palabras serán más lentas y menos completas.
