    consent_title: "¿Enviar las notas de este grafo a Pando?"
    consent_body: "Los bloques indexados de este grafo se envían a %{target} y se guardan en la base de conocimiento compartida de Pando, la memoria de los agentes. Cualquier agente o cliente de Pando que busque en esa base puede leerlos, no solo Bitacora. Las páginas con private:: true y tus exclusiones nunca se envían. Los agentes no pueden editar tus notas salvo que lo actives aparte. Puedes revocarlo cuando quieras y eliminar lo enviado."
    purge_title: "¿Revocar el consentimiento y eliminar tus datos?"
    purge_body: Revoca tu consentimiento, borra todos los documentos de este grafo de la base de conocimiento de Pando, detiene la sincronización, el chat y el acceso de los agentes a este grafo, y borra las decisiones de herramientas que Bitacora recordaba. Los archivos del grafo y el índice local no se tocan. Vuelve a aceptar para reactivarlo.
