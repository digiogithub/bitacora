[package]
name = "bitacora-app"
description = "Bitacora: GPUI Kit desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bitacora"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bitacora-core.workspace = true
bitacora-markdown.workspace = true
bitacora-index.workspace = true
bitacora-sync.workspace = true
bitacora-mcp.workspace = true
bitacora-watch.workspace = true
bitacora-config.workspace = true
# The ONLY crate allowed to depend on gpui-kit (ADR-001); reach GPUI via `gpui_kit::gpui`.
gpui-kit.workspace = true
anyhow.workspace = true
async-channel.workspace = true
clap.workspace = true
directories.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
