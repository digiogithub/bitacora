[package]
name = "bitacora-app"
description = "Bitacora: GPUI Kit desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bitacora"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bitacora-core.workspace = true
bitacora-markdown.workspace = true
bitacora-index.workspace = true
bitacora-sync.workspace = true
bitacora-runtime.workspace = true
bitacora-mcp.workspace = true
bitacora-watch.workspace = true
bitacora-config.workspace = true
bitacora-graph.workspace = true
# The ONLY crate allowed to depend on gpui-kit (ADR-001); reach GPUI via `gpui_kit::gpui`.
gpui-kit.workspace = true
anyhow.workspace = true
jiff.workspace = true
chrono.workspace = true
async-channel.workspace = true
clap.workspace = true
directories.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
velopack.workspace = true
ureq.workspace = true
semver.workspace = true
tiny-skia.workspace = true
similar.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
bitacora-testkit.workspace = true

# Installable bundles (BIT-US-0090): `cargo xtask bundle` (or `cargo packager -p bitacora-app --release`).
# Paths are relative to this manifest. Signing identities/certificates are NOT configured here:
# CI injects them through environment variables only on tagged builds (docs/design/release-process.md).
[package.metadata.packager]
product-name = "Bitacora"
identifier = "es.digio.bitacora"
description = "Outliner for Logseq-compatible Markdown graphs with git sync and an MCP server."
long-description = "Bitacora is a fast desktop outliner that reads and writes Logseq Markdown graphs, indexes them in SQLite, syncs them with git and serves an MCP endpoint."
homepage = "https://github.com/digiogithub/bitacora"
authors = ["Digio <jose@digio.es>"]
publisher = "Digio"
copyright = "Copyright (c) Digio. MIT licensed."
license-file = "../../LICENSE"
# The fonts are embedded in the binary; OFL 1.1 requires shipping the licence texts with it.
resources = [
    { src = "assets/fonts/OFL-AtkinsonHyperlegible.txt", target = "licenses/OFL-AtkinsonHyperlegible.txt" },
    { src = "assets/fonts/OFL-Literata.txt", target = "licenses/OFL-Literata.txt" },
]
category = "Productivity"
out-dir = "../../target/packager"
binaries-dir = "../../target/release"
binaries = [{ path = "bitacora", main = true }]
icons = [
    "../../packaging/icons/32x32.png",
    "../../packaging/icons/128x128.png",
    "../../packaging/icons/256x256.png",
    "../../packaging/icons/512x512.png",
    "../../packaging/icons/bitacora.icns",
    "../../packaging/icons/bitacora.ico",
]

[package.metadata.packager.macos]
minimum-system-version = "12.0"
# `signing-identity` is injected from the CI environment (never committed); unsigned when absent.

[package.metadata.packager.deb]
section = "utils"
# GPUI renders through Vulkan: the loader and an ICD are required at runtime.
depends = [
    "libvulkan1",
    "mesa-vulkan-drivers | libvulkan-driver",
    "libxkbcommon-x11-0",
    "libxkbcommon0",
    "libfontconfig1",
    "libwayland-client0",
    "libasound2t64 | libasound2",
]

[package.metadata.packager.nsis]
install-mode = "both"
compression = "lzma"
languages = ["English", "Spanish"]
