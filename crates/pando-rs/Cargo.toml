[package]
name = "pando-rs"
description = "Generic async Rust SDK for Pando (REST knowledge-base client and AG-UI agent client)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Stays `publish = false` (workspace default) until the owner publishes: flip to `true` (or
# remove the line) in the same commit that runs `cargo publish`. See README "Releasing".
publish.workspace = true
readme = "README.md"
homepage = "https://github.com/digiogithub/pando"
documentation = "https://docs.rs/pando-rs"
keywords = ["pando", "ag-ui", "sse", "knowledge-base", "agent"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]

# Generic SDK: it must never depend on a bitacora crate, so it can move to Pando `sdk/rust/`.
[lib]
name = "pando"

[lints]
workspace = true

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
