[package]
name = "pando-rs"
description = "Generic async Rust SDK for Pando (REST knowledge-base client; AG-UI client planned)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "README.md"

# Generic SDK: it must never depend on a bitacora crate, so it can move to Pando `sdk/rust/`.
[lib]
name = "pando"

[lints]
workspace = true

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
