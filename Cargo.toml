[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/digiogithub/bitacora"
rust-version = "1.90"
publish = false

# Profiles: see docs/analysis/rust/crate-stack.md section 5.1.
[profile.dev]
debug = "line-tables-only"      # faster links; GPUI debug info is huge

[profile.dev.package."*"]
opt-level = 1                   # GPUI is sluggish at opt-level 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"                # keep for crash reporting

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

# Exact third-party pins. Member crates opt in with `foo.workspace = true`;
# only declare here what a crate really uses (keeps `cargo machete` clean).
[workspace.dependencies]
# Workspace crates
bitacora-markdown = { path = "crates/bitacora-markdown" }
bitacora-config = { path = "crates/bitacora-config" }
bitacora-core = { path = "crates/bitacora-core" }
bitacora-watch = { path = "crates/bitacora-watch" }
bitacora-index = { path = "crates/bitacora-index" }
bitacora-merge = { path = "crates/bitacora-merge" }
bitacora-sync = { path = "crates/bitacora-sync" }
bitacora-mcp = { path = "crates/bitacora-mcp" }
bitacora-pando = { path = "crates/bitacora-pando" }
bitacora-runtime = { path = "crates/bitacora-runtime" }
bitacora-graph = { path = "crates/bitacora-graph" }
bitacora-testkit = { path = "crates/bitacora-testkit" }
# Generic Pando SDK; depends on no bitacora crate (ADR-027)
pando-rs = { path = "crates/pando-rs" }

# UI (only bitacora-app may use it; ADR-001)
gpui-kit = { version = "=0.7.1" }

# Async / HTTP / MCP (never in bitacora-core; ADR-012)
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = "0.8.9"
rmcp = { version = "~3.5", features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-streamable-http-server-session", "transport-io"] }
schemars = "1"
subtle = "2.6"
getrandom = "0.4"
async-channel = "2.5"
# pando-rs HTTP client (rustls only, no native-tls); already in the lock via gix
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

# Storage
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks", "backup"] }
rusqlite_migration = "2.6"

# Parsing / diff
pulldown-cmark = "0.13"
diffy = "0.5"
imara-diff = "0.2"
similar = "3.2"
edn-rs = "0.19"

# Git (ADR-007 / ADR-020): gix incl. network client for the gix-only fallback
gix = { version = "0.88", default-features = false, features = ["max-performance-safe", "blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "credentials", "merge", "blob-diff", "status", "index", "revision", "sha1", "worktree-mutation"] }

# Push without system git (ADR-023): libgit2 behind GitBackend; vendored so no system libgit2/OpenSSL
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }

# Watching, search, misc
notify = "8.2"
notify-debouncer-full = "0.7"
uuid = { version = "1.27", features = ["v4", "v5", "v7", "serde"] }
rayon = "1.12"
jiff = "0.2"
# Only the calendar facade (crates/bitacora-app/src/ui) names it: GPUI Kit calendar dates are chrono values.
chrono = { version = "0.4", default-features = false }
nucleo = "0.5"
nucleo-matcher = "0.3"
directories = "6"
blake3 = "1.8"
libc = "0.2"
toml = "1.1"
keyring = "4.2"
rust-i18n = "4.2"
velopack = "=1.2.161"
semver = "1"

# Logging / serialization / errors / CLI
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# Filesystem helpers
fs-err = "3"
tempfile = "3"
# Graph PNG export (BIT-US-0160); already in the lockfile through gpui-pre -> resvg, BSD-3-Clause.
tiny-skia = "=0.11.4"
# Windows-only build dependency of bitacora-app: embeds the .exe icon. Same version gpui-pre uses.
embed-resource = "=3.0.12"
sys-locale = "0.3"
ignore = "0.4"
walkdir = "2.5"
globset = "0.4"
regex = "1"
unicode-normalization = "0.1"
unicode-segmentation = "=1.13.3"
parking_lot = "0.12"

# Tooling (xtask)
cargo_metadata = "0.23"
sha2 = "0.11"

# Self-update of bitacora-cli (BIT-US-0110)
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }
tar = { version = "0.4", default-features = false }
flate2 = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# Dev / test
insta = "1.49"
proptest = "1.11"
criterion = "0.8"
