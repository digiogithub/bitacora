[files]
extend-exclude = [
    "fixtures/graphs/**",
    "Cargo.lock",
    "docs/.pmngr/**",
    "LICENSE",
    # Spanish translations are not English words
    "crates/bitacora-app/assets/locales/es.yml",
    "crates/bitacora-app/assets/locales/*.es.yml",
    # Chinese translations are not English words
    "crates/bitacora-app/assets/locales/zh.yml",
    "crates/bitacora-app/assets/locales/*.zh.yml",
    # Vendored design system sources and docs are written in Spanish
    "design/**",
]

[default.extend-words]
# Short identifiers used in merge/index code (ours/theirs, base/ancestor, ...)
ot = "ot"
ba = "ba"
pn = "pn"
anc = "anc"
rela = "rela"
# "Café" test vectors split by the tokenizer
caf = "caf"
Caf = "Caf"
CAF = "CAF"
ANDed = "ANDed"
Ded = "Ded"
flate = "flate"
bitacora = "bitacora"
Bitacora = "Bitacora"
logseq = "logseq"
lowbar = "lowbar"
LOGBOOK = "LOGBOOK"
gpui = "gpui"
edn = "edn"
Nd = "Nd"
mis = "mis"
unparseable = "unparseable"
# Level of detail (graph view docs)
LOD = "LOD"
# Streaming-delta test fragment ("Hel" + "lo ")
Hel = "Hel"
# Spanish words quoted from the design-system docs / generated token descriptions
componentes = "componentes"
controles = "controles"
decorativo = "decorativo"
