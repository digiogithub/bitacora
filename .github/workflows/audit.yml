name: Audit

# RustSec advisory check when dependencies change (no schedule); fails loudly on new advisories.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
