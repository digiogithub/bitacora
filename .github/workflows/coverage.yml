name: Coverage

# Optional job: run manually or weekly. Produces lcov.info as a workflow artifact;
# nothing is uploaded to third-party services.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  INSTA_UPDATE: "no"
  CI: "true"

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: script/install-linux-deps.sh --minimal
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: llvm-tools-preview
          cache-shared-key: coverage
          cache-save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate lcov (GPUI app excluded)
        run: cargo llvm-cov --workspace --exclude bitacora-app --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
