# cargo-deny configuration (ADR-014: project is MIT; no GPL code from Zed crates).
[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
# Anything not listed here (notably GPL-*, AGPL-*, LGPL-*) is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]

# ADR-023 (git2 / libgit2): the Rust crates `git2`, `libgit2-sys`, `libssh2-sys`, `openssl-src`
# are MIT/Apache-2.0 and pass the allowlist above, so no [[licenses.exceptions]] entry is needed.
# The bundled C sources are NOT scanned by cargo-deny: libgit2 is GPL-2.0 WITH linking exception
# (explicitly accepted by the project owner, ADR-023; the exception permits linking from MIT code),
# libssh2 is BSD-3-Clause, OpenSSL 3.x is Apache-2.0. They are vendored (`vendored-libgit2`,
# `vendored-openssl`) so no system library is needed. Disable the `git2-push` feature of
# `bitacora-sync` to drop libgit2 entirely.

# Embedded fonts (bitacora-app/assets/fonts) are SIL OFL 1.1 data files, not crates, so
# cargo-deny does not scan them and "OFL-1.1" is intentionally not in the allowlist. Their
# notices live in crates/bitacora-app/NOTICE and assets/fonts/OFL-*.txt.

[bans]
multiple-versions = "warn"
wildcards = "allow"
# GPL Zed crates have generic names (editor, ui, theme, workspace, ...), so they
# are blocked by the license allowlist above rather than by name.
# Only `gpui-pre` (brought in by `gpui-kit`) is allowed; the crates.io `gpui`
# crate must never be a dependency (ADR-001).
deny = [
    { crate = "gpui", reason = "use gpui-kit, which pins gpui-pre (ADR-001)" },
]

[advisories]
version = 2
yanked = "deny"
# Only "unmaintained" notices, all transitive through gpui-kit / gpui-pre (we cannot
# patch them). Re-evaluate when gpui-kit is bumped. No vulnerability is ignored.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; transitive via gpui-kit" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive via gpui-kit" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via gpui-kit" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; transitive via gpui-pre" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via gpui-pre" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained (proc-macro, no runtime code); transitive via velopack (ADR-018)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, no fixed release; transitive via zbus (gpui-pre, keyring)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, no fixed release; transitive via zbus (gpui-pre, keyring)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, no fixed release; transitive via zbus (gpui-pre, keyring)" },
    # zip 8.x extraction advisories: our own code is on zip 9; the 8.x copy is only in velopack
    # 1.2.161 (ADR-018), whose fix exists only as a 1.3 pre-release. It unpacks update packages
    # from our own signed GitHub releases. Remove when velopack ships a stable release on zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.x via velopack 1.2.161 only; trusted update packages" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.x via velopack 1.2.161 only; trusted update packages" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.x via velopack 1.2.161 only; trusted update packages" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.x via velopack 1.2.161 only; trusted update packages" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
