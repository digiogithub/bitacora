# cargo-nextest configuration. The `ci` profile writes a JUnit report that
# `gintrack spec ingest` maps to requirement traces (see docs/changes/bit-us-0095-*.md):
#
#   cargo nextest run -p bitacora-markdown --profile ci --locked
#   gintrack spec ingest target/nextest/ci/junit.xml --repo .
#   gintrack spec verify BIT-SP-0001.R1 ...        # add --commit to stamp
#
# The report lands in target/nextest/ci/junit.xml.

[profile.default]
fail-fast = false

[profile.ci]
fail-fast = false
retries = 0

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
